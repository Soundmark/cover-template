<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书封面生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Tab 导航 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="cover">封面制作</button>
    <button class="tab-btn" data-tab="blueprint">图纸创作</button>
  </nav>

  <!-- 图纸尺寸识别工作区 -->
  <section id="blueprint-workspace" class="blueprint-workspace" hidden>
    <div class="bp-container">
      <!-- 步骤指示器 -->
      <div class="bp-steps">
        <div class="bp-step active" data-step="1">
          <span class="bp-step-num">1</span>
          <span class="bp-step-label">导入图片</span>
        </div>
        <div class="bp-step" data-step="2">
          <span class="bp-step-num">2</span>
          <span class="bp-step-label">裁剪图纸</span>
        </div>
        <div class="bp-step" data-step="3">
          <span class="bp-step-num">3</span>
          <span class="bp-step-label">对齐网格</span>
        </div>
        <div class="bp-step" data-step="4">
          <span class="bp-step-num">4</span>
          <span class="bp-step-label">创作</span>
        </div>
      </div>

      <!-- 主内容区 -->
      <div class="bp-main">
        <!-- 图片预览区 -->
        <div class="bp-preview-panel">
          <div class="bp-upload-zone" id="bp-upload-zone">
            <p>点击或拖拽上传图片</p>
            <input id="bp-image-input" type="file" accept="image/*" hidden />
          </div>
          <div class="bp-canvas-container" id="bp-canvas-container" hidden>
            <div class="bp-canvas-wrapper" id="bp-canvas-wrapper">
              <canvas id="bp-canvas"></canvas>
              <div class="crop-stage" id="bp-crop-stage" hidden>
                <div class="crop-rect" id="bp-crop-rect">
                  <div class="handle nw" data-handle="nw"></div>
                  <div class="handle n" data-handle="n"></div>
                  <div class="handle ne" data-handle="ne"></div>
                  <div class="handle e" data-handle="e"></div>
                  <div class="handle se" data-handle="se"></div>
                  <div class="handle s" data-handle="s"></div>
                  <div class="handle sw" data-handle="sw"></div>
                  <div class="handle w" data-handle="w"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 操作面板 -->
        <div class="bp-actions-panel">
          <!-- 步骤1: 导入后显示裁剪按钮 -->
          <div class="bp-action-step" id="bp-action-step1" hidden>
            <button class="btn primary" id="bp-start-crop">开始裁剪图纸区域</button>
            <button class="btn" id="bp-reset-image">重新选择图片</button>
          </div>

          <!-- 步骤2: 裁剪确认 -->
          <div class="bp-action-step" id="bp-action-step2" hidden>
            <p class="hint">单指拖动平移 · 双指缩放 · 拖动边框调整裁剪框</p>
            <button class="btn primary" id="bp-confirm-crop">确认裁剪</button>
            <button class="btn" id="bp-cancel-crop">取消</button>
          </div>

          <!-- 步骤3: 对齐网格 -->
          <div class="bp-action-step" id="bp-action-step3" hidden>
            <div class="bp-grid-controls">
              <div class="bp-grid-inputs">
                <label>格子数</label>
                <div class="bp-grid-input-row">
                  <input type="number" id="bp-grid-w" min="1" placeholder="宽" />
                  <span class="bp-grid-input-x">×</span>
                  <input type="number" id="bp-grid-h" min="1" placeholder="高" />
                </div>
              </div>
              <button class="btn primary" id="bp-generate-grid">生成网格</button>
            </div>
            <div class="bp-mode-toggle" id="bp-mode-toggle" hidden>
              <button class="btn small mode-btn active" data-mode="image">图纸</button>
              <button class="btn small mode-btn" data-mode="grid">网格</button>
              <button class="btn small mode-btn" data-mode="all">整体</button>
            </div>
            <p class="hint">单指拖拽移动 · 双指缩放大小</p>
            <div class="bp-action-row">
              <button class="btn primary" id="bp-start-craft" hidden>进入创作</button>
              <button class="btn" id="bp-restart">重新开始</button>
            </div>
          </div>

          <!-- 步骤4: 创作 -->
          <div class="bp-action-step" id="bp-action-step4" hidden>
            <div class="bp-craft-tools" id="bp-craft-tools">
              <button class="btn small craft-btn active" data-craft="paint">🖌 涂色</button>
              <button class="btn small craft-btn" data-craft="pick">💧 吸色</button>
              <button class="btn small craft-btn" data-craft="erase">🧹 橡皮</button>
              <button class="btn small craft-btn" data-craft="move">✋ 移动</button>
            </div>
            <div class="bp-action-row">
              <button class="btn small" id="bp-undo">↩ 撤销</button>
              <button class="bp-current-color" id="bp-current-color" type="button">
                <span class="bp-current-swatch" id="bp-current-swatch"></span>
                <span class="bp-current-id" id="bp-current-id">—</span>
              </button>
            </div>
            <div class="bp-action-row">
              <button class="btn" id="bp-back-to-align">返回调整</button>
              <button class="btn" id="bp-restart2">重新开始</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main class="app">
    <!-- 空状态:还没上传模板 -->
    <section id="empty-state" class="empty-state" data-tab-content="cover" hidden>
      <h1>小红书封面生成器</h1>
      <p>先上传一张 PSD 导出的 PNG 模板,程序会记住它,以后只改标题和主图。</p>
      <label class="btn primary">
        上传模板
        <input id="template-input" type="file" accept="image/png,image/jpeg,image/jpg" hidden />
      </label>
      <p class="hint">建议尺寸 1080×1440,文件大小 < 1MB</p>
    </section>

    <!-- 正常态:已上传模板,显示表单 + 预览 -->
    <section id="workspace" class="workspace" data-tab-content="cover" hidden>
      <header class="workspace-header">
        <h1>小红书封面生成器</h1>
        <div class="header-actions">
          <button id="reupload-btn" class="btn small">🔄 换模板</button>
        </div>
      </header>

      <div class="workspace-body">
        <div class="preview-panel">
          <canvas id="preview"></canvas>
        </div>

        <aside class="form-panel">
          <fieldset class="group">
            <legend>标题</legend>
            <div class="field">
              <label for="title-input">大标题</label>
              <textarea id="title-input" rows="3" placeholder="输入今天的标题…"></textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="title-font-size">字号</label>
                <input id="title-font-size" type="number" min="12" max="200" />
              </div>
              <div class="field">
                <label for="title-color">字色</label>
                <input id="title-color" type="text" placeholder="#FFFFFF" />
              </div>
            </div>
            <div class="field">
              <label for="title-y">Y 位置<span class="hint-inline">(X 自动居中)</span></label>
              <input id="title-y" type="number" />
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>主图</legend>
            <div class="field">
              <label for="main-image-input">主图文件</label>
              <input id="main-image-input" type="file" accept="image/*" />
            </div>
            <div class="field">
              <label for="main-image-y">Y 位置<span class="hint-inline">(X 自动居中)</span></label>
              <input id="main-image-y" type="number" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="main-image-w">宽</label>
                <input id="main-image-w" type="number" min="1" />
              </div>
              <div class="field">
                <label for="main-image-h">高</label>
                <input id="main-image-h" type="number" min="1" />
              </div>
            </div>
            <p class="hint">宽高按纵横比联动 · 上传新图会弹裁剪</p>
          </fieldset>

          <fieldset class="group">
            <legend>画布</legend>
            <div class="field-row">
              <div class="field">
                <label for="canvas-w">画布宽</label>
                <input id="canvas-w" type="number" min="100" />
              </div>
              <div class="field">
                <label for="canvas-h">画布高</label>
                <input id="canvas-h" type="number" min="100" />
              </div>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>图纸尺寸</legend>
            <div class="field">
              <label for="blueprint-text-input">文字内容</label>
              <textarea id="blueprint-text-input" rows="2" placeholder="A3 297×420"></textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="blueprint-x">X 位置</label>
                <input id="blueprint-x" type="number" />
              </div>
              <div class="field">
                <label for="blueprint-y">Y 位置</label>
                <input id="blueprint-y" type="number" />
              </div>
            </div>
            <div class="field">
              <label for="blueprint-color">字色</label>
              <input id="blueprint-color" type="text" placeholder="#FFFFFF" />
            </div>
            <div class="field">
              <label for="blueprint-font-size">字号</label>
              <input id="blueprint-font-size" type="number" min="8" max="200" />
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>标签</legend>
            <div class="field">
              <label for="tags-text-input">标签文字<span class="hint-inline">(用顿号隔开)</span></label>
              <textarea id="tags-text-input" rows="2" placeholder="入门、基础、进阶"></textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="tags-x">X 位置</label>
                <input id="tags-x" type="number" />
              </div>
              <div class="field">
                <label for="tags-y">Y 位置</label>
                <input id="tags-y" type="number" />
              </div>
            </div>
            <div class="field">
              <label for="tags-color">字色</label>
              <input id="tags-color" type="text" placeholder="#FFFFFF" />
            </div>
            <div class="field">
              <label for="tags-font-size">字号</label>
              <input id="tags-font-size" type="number" min="8" max="200" />
            </div>
          </fieldset>

          <fieldset class="group">
            <legend>宣传语</legend>
            <div class="field">
              <label for="slogan-text">当前文字</label>
              <textarea id="slogan-text" rows="2" placeholder="选自下方预设，或直接输入"></textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="slogan-x">X 位置</label>
                <input id="slogan-x" type="number" />
              </div>
              <div class="field">
                <label for="slogan-y">Y 位置</label>
                <input id="slogan-y" type="number" />
              </div>
            </div>
            <div class="field">
              <label for="slogan-color">字色</label>
              <input id="slogan-color" type="text" placeholder="#FFFFFF" />
            </div>
            <div class="field">
              <label for="slogan-font-size">字号</label>
              <input id="slogan-font-size" type="number" min="8" max="200" />
            </div>
            <div class="field">
              <label>预设列表</label>
              <div id="slogan-presets" class="preset-list"></div>
            </div>
            <div class="field-row">
              <input id="slogan-preset-input" type="text" placeholder="新预设内容" />
              <button id="slogan-add-preset-btn" class="btn small">添加</button>
            </div>
            <button id="slogan-random-btn" class="btn small">随机抽取</button>
          </fieldset>

          <div class="actions">
            <button id="reset-btn" class="btn">↺ 重置</button>
            <button id="download-btn" class="btn primary">⬇ 下载 PNG</button>
          </div>

          <button id="clear-btn" class="btn link danger">清空所有数据(模板和配置)</button>
        </aside>
      </div>
    </section>
  </main>

  <!-- 裁剪弹窗 -->
  <div id="crop-modal" class="modal" hidden>
    <div class="modal-content crop-modal-content">
      <h2>裁剪主图</h2>
      <p class="hint">拖动角和边调整裁剪框,框内可整体拖动。</p>

      <div class="crop-stage" id="crop-stage">
        <canvas id="crop-canvas"></canvas>
        <div class="crop-overlay">
          <div class="crop-mask top"></div>
          <div class="crop-mask bottom"></div>
          <div class="crop-mask left"></div>
          <div class="crop-mask right"></div>
          <div class="crop-rect" id="crop-rect">
            <div class="handle nw" data-handle="nw"></div>
            <div class="handle n" data-handle="n"></div>
            <div class="handle ne" data-handle="ne"></div>
            <div class="handle e" data-handle="e"></div>
            <div class="handle se" data-handle="se"></div>
            <div class="handle s" data-handle="s"></div>
            <div class="handle sw" data-handle="sw"></div>
            <div class="handle w" data-handle="w"></div>
          </div>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="crop-w">裁剪宽</label>
          <input id="crop-w" type="number" min="1" />
        </div>
        <div class="field">
          <label for="crop-h">裁剪高</label>
          <input id="crop-h" type="number" min="1" />
        </div>
      </div>

      <div class="modal-actions">
        <button id="crop-cancel" class="btn">取消</button>
        <button id="crop-confirm" class="btn primary">确认</button>
      </div>
    </div>
  </div>

  <!-- 调色板弹窗 -->
  <div id="bp-palette-modal" class="modal" hidden>
    <div class="modal-content bp-palette-modal-content">
      <h2>选择颜色</h2>
      <div class="bp-palette" id="bp-palette"></div>
      <div class="modal-actions">
        <button id="bp-palette-close" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <!-- 重置确认弹窗 -->
  <div id="bp-reset-modal" class="modal" hidden>
    <div class="modal-content">
      <h2>确认重置</h2>
      <p>将清除当前图片和所有涂色，是否继续？</p>
      <div class="modal-actions">
        <button id="bp-reset-cancel" class="btn">取消</button>
        <button id="bp-reset-confirm" class="btn primary">确认重置</button>
      </div>
    </div>
  </div>

  <!-- 提示横幅 -->
  <div id="toast" class="toast" hidden></div>

  <script src="beadColor.js"></script>
  <script src="blueprint.js"></script>
  <script src="app.js"></script>
</body>
</html>
